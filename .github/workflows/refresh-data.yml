name: Refresh Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data
        run: python generate-data.py

      - name: Open PR and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Exit early if nothing changed
          git diff --quiet data/fact_sales.csv data/fact_salesperson_targets.csv README.md && exit 0

          BRANCH="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/fact_sales.csv data/fact_salesperson_targets.csv README.md
          git commit -m "chore: refresh data [$(date -u +%Y-%m-%d)]"
          # Remove any leftover branch from a previous failed run
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: refresh data [$(date -u +%Y-%m-%d)]" \
            --body "Automated daily data refresh." \
            --base main \
            --head "$BRANCH")

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')

          # GITHUB_TOKEN cannot approve its own PR, so use GH_PAT for the approval step
          GH_TOKEN="$GH_PAT" gh pr review "$PR_NUMBER" --approve

          gh pr merge "$PR_NUMBER" --squash --delete-branch
